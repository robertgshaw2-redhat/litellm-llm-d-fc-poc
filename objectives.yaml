# Static mapping: LiteLLM identity -> llm-d flow control objective.
#
# Read by hooks/flow_control.py on every request (re-read when the file's mtime
# changes, so an edit takes effect without restarting the proxy).
#
# Precedence, most specific first:   keys > users > teams > defaults
#
# This POC uses only the `keys` tier; `users:` and `teams:` are supported by the
# hook and slot in here the same way, keyed by LiteLLM `user_id` / `team_id`.
#
# The values under `objective` must match the name of an InferenceObjective in
# the model's namespace -- llm-d rejects (or, depending on EPP config, defaults)
# an objective it cannot resolve.

# Only inject the headers for model groups actually served by llm-d. Anything
# else routed through this proxy (a hosted API, an embedding endpoint) is left
# untouched, since providers reject unknown headers.
models:
  - "gemma-4*"

defaults:
  objective: standard
  fairness_id_from: key_alias

# Keyed by the virtual key's alias (`key_alias`), not the key itself.
keys:
  forge:
    objective: premium

  lightwell:
    objective: standard

  # Saturation-based demotion, driven by LiteLLM's own v3 rate limiter
  # counters (the numbers behind the x-ratelimit-* response headers), not by
  # anything this hook tracks itself. meridian's key has tpm_limit: 1000
  # (poc_keys.yaml); once the most-saturated of its limits crosses demote_at,
  # requests are stamped `demote_to` instead of premium -- still admitted.
  # The limiter's own hard 429 at 100% remains the backstop.
  #
  # demote_at is tiny (0.4% = 4 of 1000 tokens) so the POC crosses it in two
  # requests; real values would be 0.5-0.9.
  meridian:
    objective: premium
    demote_at: 0.004
    demote_to: best-effort
